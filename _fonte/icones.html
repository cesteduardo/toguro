<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ícones 3D (path tracing)</title>
<!--
  Fonte dos ícones 3D dos cartões das empresas (assets/icones/*.webp), em PATH TRACING
  (luz realista, como no Blender) com three-gpu-pathtracer, na GPU.
  Uma vez: cd _fonte && npm install   (node_modules fica fora do git)
  Depois: python3 -m http.server na RAIZ do projeto e abra
  /_fonte/icones.html?i=alien&n=1000  (alien | raio | microfone | camiseta; n = amostras).
  Quando body[data-pronto] aparece, capture o canvas com fundo transparente (ver LEIA-ME).
-->
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<script type="importmap">{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "three/examples/jsm/": "./node_modules/three/examples/jsm/",
  "three-mesh-bvh": "./node_modules/three-mesh-bvh/src/index.js",
  "three-gpu-pathtracer": "./node_modules/three-gpu-pathtracer/src/index.js"
} }</script>
</head>
<body>
<canvas id="c" style="width:1000px;height:1000px"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { WebGLPathTracer, GradientEquirectTexture } from 'three-gpu-pathtracer';

const Q = new URLSearchParams(location.search);
const qual = Q.get('i') || 'alien', AMOSTRAS = +(Q.get('n') || 700);
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
r.setPixelRatio(1); r.setSize(1000, 1000, false);
r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
r.setClearColor(0x000000, 0);

const cena = new THREE.Scene();
cena.background = null;
/* céu do estúdio: claro em cima, quase preto embaixo, com um pouco da cor da peça */
const ceu = new GradientEquirectTexture(256);
ceu.topColor.set(0xffffff).multiplyScalar(.55); ceu.bottomColor.set(0x0a0c0b); ceu.exponent = 1.6; ceu.update();
cena.environment = ceu; cena.environmentIntensity = 1;

const cam = new THREE.PerspectiveCamera(20, 1, .1, 100); cam.position.set(0, .35, 14); cam.lookAt(0, 0, 0);

/* softboxes: chave grande no alto à esquerda, recorte atrás à direita, rebatedor embaixo */
const caixa = (w, h, cor, forca, pos) => { const l = new THREE.RectAreaLight(cor, forca, w, h); l.position.set(...pos); l.lookAt(0, 0, 0); cena.add(l); return l; };
caixa(7, 7, 0xffffff, 9, [-6, 7, 7]);
caixa(3, 9, 0xffffff, 12, [7, 2, -5]);
caixa(4, 10, 0xffffff, 5, [-8, -1, -3]);
caixa(10, 3, 0xffffff, 2.2, [0, -7, 5]);

const obj = new THREE.Group(); cena.add(obj);

/* plástico "doce" de ícone: brilho com verniz e um véu acetinado */
const plastico = (cor, extra = {}) => new THREE.MeshPhysicalMaterial({ color: cor, roughness: .34, clearcoat: 1, clearcoatRoughness: .05, sheen: .12, sheenRoughness: .4, sheenColor: new THREE.Color(0xffffff), ...extra });
/* degradê de cor de cima para baixo: uma textura vertical, com o UV de cada
   vértice pela altura (as cores por vértice saem riscadas no path tracer) */
function degrade(geo, cima, baixo, curva = 1) {
  geo.computeBoundingBox();
  const { min, max } = geo.boundingBox, pos = geo.attributes.position;
  const uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) uv.set([.5, Math.pow((pos.getY(i) - min.y) / (max.y - min.y || 1), curva)], i * 2);
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d'), l = g.createLinearGradient(0, 0, 0, 512);
  l.addColorStop(0, cima); l.addColorStop(1, baixo); g.fillStyle = l; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  geo.userData.mapa = t;
  return geo;
}
const semNormal = (g) => { g.deleteAttribute('normal'); return g; };
const comCor = (geo, extra = {}) => plastico(0xffffff, { map: geo.userData.mapa, ...extra });
/* "almofada": quase sem parede reta; a borda inteira é o bisel arredondado */
const extruda = (forma, prof, bisel, seg = 20, lado = .45) => {
  const g = new THREE.ExtrudeGeometry(forma, { depth: prof, bevelEnabled: true, bevelThickness: bisel, bevelSize: bisel * lado, bevelSegments: seg, curveSegments: 64 });
  g.center(); g.computeVertexNormals(); return g;
};
const preto = new THREE.MeshPhysicalMaterial({ color: 0x030403, roughness: .08, clearcoat: 1, clearcoatRoughness: .02 });

if (qual === 'alien') {
  /* cabeça: crânio largo que afina até o queixo, sem quina; cavidades suaves para os olhos */
  const geo = new THREE.SphereGeometry(1, 220, 160), p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const d = Math.max(0, -v.y), k = 1 - .52 * Math.pow(d, 1.7);
    v.x *= 1.07 * k; v.z *= .9 * k; v.y *= 1 + .45 * d;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  const olhos = [-1, 1].map((s) => new THREE.Vector3(s * .42, -.12, .64));
  const n = new THREE.Vector3();
  geo.computeVertexNormals();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); if (v.z < 0) continue;
    olhos.forEach((o, j) => {
      const s = j ? 1 : -1;
      /* elipse inclinada como o olho: ponta de dentro para baixo */
      const dx = v.x - o.x, dy = v.y - o.y, a = s * .45;
      const u = (dx * Math.cos(a) + dy * Math.sin(a)) / .5, w = (-dx * Math.sin(a) + dy * Math.cos(a)) / .27;
      const f = Math.max(0, 1 - (u * u + w * w)); if (!f) return;
      n.fromBufferAttribute(geo.attributes.normal, i);
      v.addScaledVector(n, -.07 * f * f);
    });
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals(); degrade(geo, '#C2FF45', '#139A08', 1.1);
  obj.add(new THREE.Mesh(geo, comCor(geo, { roughness: .32 })));
  olhos.forEach((o, j) => {
    const s = j ? 1 : -1;
    const e = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), preto);
    e.scale.set(.44, .21, .13); e.rotation.z = s * .45; e.rotation.y = s * .42;
    e.position.set(o.x * .98, o.y, o.z - .015); obj.add(e);
  });
  obj.rotation.set(.06, -.3, .03); obj.scale.setScalar(1.75); obj.position.y = .1;
} else if (qual === 'raio') {
  const f = new THREE.Shape();
  [[-.1, 1.5], [.68, 1.5], [.22, .34], [.84, .34], [-.48, -1.55], [-.06, -.18], [-.64, -.18]].forEach(([x, y], i) => (i ? f.lineTo(x, y) : f.moveTo(x, y)));
  f.closePath();
  const base = degrade(extruda(f, .06, .34, 32, .4), '#FFEE3A', '#FF7A00', .9); const geo = mergeVertices(semNormal(base)); geo.userData.mapa = base.userData.mapa;
  geo.computeVertexNormals();
  obj.add(new THREE.Mesh(geo, comCor(geo, { roughness: .3 })));
  obj.rotation.set(.16, -.48, -.1); obj.scale.setScalar(1.3);
} else if (qual === 'microfone') {
  /* grelha: furos de verdade na cor (mapa) + relevo (mapa de normal) */
  const W = 1024, H = 512, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#e9efed'; g.fillRect(0, 0, W, H); g.fillStyle = '#121615';
  for (let y = 8; y < H; y += 16) for (let x = (y / 16) % 2 ? 8 : 16; x < W; x += 16) { g.beginPath(); g.arc(x, y, 4.6, 0, Math.PI * 2); g.fill(); }
  const tg = new THREE.CanvasTexture(c); tg.colorSpace = THREE.SRGBColorSpace; tg.wrapS = THREE.RepeatWrapping; tg.anisotropy = 16;
  const cabeca = new THREE.Mesh(new THREE.SphereGeometry(.72, 160, 120), new THREE.MeshPhysicalMaterial({ map: tg, metalness: .9, roughness: .3 }));
  cabeca.position.y = 1.02; obj.add(cabeca);
  const cromo = new THREE.MeshPhysicalMaterial({ color: 0xf2f5f4, metalness: 1, roughness: .12 });
  const aro = new THREE.Mesh(new THREE.TorusGeometry(.62, .1, 48, 160), cromo); aro.rotation.x = Math.PI / 2; aro.position.y = .52; obj.add(aro);
  const perfil = [[0, -1.32], [.2, -1.32], [.27, -1.28], [.3, -1.2], [.35, -.6], [.43, .2], [.5, .45], [.52, .52], [0, .52]].map(([x, y]) => new THREE.Vector2(x, y));
  const corpo = degrade(new THREE.LatheGeometry(perfil, 160), '#26FFC2', '#008A5E', 1);
  obj.add(new THREE.Mesh(corpo, comCor(corpo, { roughness: .3 })));
  const base = new THREE.Mesh(new THREE.TorusGeometry(.26, .05, 32, 96), cromo); base.rotation.x = Math.PI / 2; base.position.y = -1.27; obj.add(base);
  const botao = new THREE.Mesh(new RoundedBoxGeometry(.13, .34, .1, 6, .05), preto); botao.position.set(0, -.18, .4); botao.rotation.x = -.09; obj.add(botao);
  obj.rotation.set(.1, .35, -.5); obj.scale.setScalar(1.18); obj.position.set(.1, -.05, 0);
} else if (qual === 'camiseta') {
  const f = new THREE.Shape();
  f.moveTo(-.36, 1.02);
  [[-.98, .86], [-1.44, .28], [-1.06, .0], [-.78, .3], [-.78, -1.08], [.78, -1.08], [.78, .3], [1.06, .0], [1.44, .28], [.98, .86], [.36, 1.02]].forEach(([x, y]) => f.lineTo(x, y));
  f.quadraticCurveTo(0, .5, -.36, 1.02);
  const base = degrade(extruda(f, .06, .3, 32, .5), '#4FDCFF', '#0650C2', 1); const geo = mergeVertices(semNormal(base)); geo.userData.mapa = base.userData.mapa;
  geo.computeVertexNormals();
  const tecido = comCor(geo, { roughness: .55, clearcoat: .35, clearcoatRoughness: .3, sheen: 1, sheenRoughness: .6 });
  obj.add(new THREE.Mesh(geo, tecido));
  /* gola: um tubo macio seguindo o decote */
  const curva = new THREE.QuadraticBezierCurve3(new THREE.Vector3(-.36, 1.02, 0), new THREE.Vector3(0, .5, 0), new THREE.Vector3(.36, 1.02, 0));
  const gola = new THREE.Mesh(new THREE.TubeGeometry(curva, 64, .075, 24), plastico(0x0a5ea6, { roughness: .5, sheen: 1 }));
  gola.position.z = .22; obj.add(gola);
  /* estampa: o alienígena verde do logo oficial */
  const tex = await new THREE.TextureLoader().loadAsync('../assets/alien-verde.webp');
  tex.colorSpace = THREE.SRGBColorSpace;
  const prop = tex.image.width / tex.image.height, alt = .8;
  const est = new THREE.Mesh(new THREE.PlaneGeometry(alt * prop, alt), new THREE.MeshPhysicalMaterial({ map: tex, transparent: true, alphaTest: .5, roughness: .45, clearcoat: .5 }));
  est.position.set(0, -.1, .345); obj.add(est);
  obj.rotation.set(.12, -.4, .05); obj.scale.setScalar(1.3);
}

const pt = new WebGLPathTracer(r);
pt.bounces = 8; pt.filterGlossyFactor = .4; pt.tiles.set(2, 2); pt.minSamples = 1; pt.renderDelay = 0; pt.fadeDuration = 0;
pt.setScene(cena, cam);
const passo = () => {
  pt.renderSample();
  document.body.dataset.amostras = pt.samples;
  if (pt.samples < AMOSTRAS) requestAnimationFrame(passo);
  else document.body.dataset.pronto = '1';
};
passo();
</script>
</body>
</html>
